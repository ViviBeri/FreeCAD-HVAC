name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test tools
        run: python -m pip install --upgrade pip pytest ruff

      - name: Run unit tests
        run: python -m pytest -q

      - name: Check changed Python files with Ruff
        run: |
          ruff check freecad/HVAC/core/Segment.py tests/test_segment_reactive_properties.py --select E302,E303,I
          ruff format --check freecad/HVAC/core/Segment.py tests/test_segment_reactive_properties.py
