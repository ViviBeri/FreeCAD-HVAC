name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    name: Segment trim regression tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install pinned test tools from binary wheels only
        run: python -m pip install --only-binary=:all: "pytest==9.2.0" "ruff==0.17.3"

      - name: Run segment trim regression tests
        run: python -m pytest -q tests/test_segment_reactive_properties.py -k "compute_edge_trim_data"

      - name: Check changed Python files with Ruff
        run: |
          ruff check --preview freecad/HVAC/core/Segment.py tests/test_segment_reactive_properties.py --select E302,E303,I
